<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Galeria 3D Mobile Optimized</title>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.136.0/build/three.module.js",
    "three/": "https://cdn.jsdelivr.net/npm/three@0.136.0/"
  }
}
</script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f5f5f5;
}

#home{
  display:flex;
  flex-wrap:wrap;
  gap:16px;
  padding:16px;
  justify-content:center;
}

.card{
  width:210px;
  background:#fff;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 4px 12px rgba(0,0,0,.08);
  cursor:pointer;
  transition:.2s;
}

.card:hover{
  transform:scale(1.03);
}

.card img{
  width:100%;
  height:140px;
  object-fit:cover;
  display:block;
}

.card p{
  margin:12px;
  text-align:center;
  font-size:15px;
}

#viewer{
  display:none;
  width:100vw;
  height:100vh;
  overflow:hidden;
}

#backBtn{
  position:fixed;
  top:16px;
  left:16px;
  z-index:10;
  padding:10px 14px;
  border:none;
  border-radius:8px;
  background:#fff;
  cursor:pointer;
  display:none;
  box-shadow:0 4px 12px rgba(0,0,0,.15);
}

#loading{
  position:fixed;
  top:16px;
  right:16px;
  z-index:10;
  background:#fff;
  padding:10px 14px;
  border-radius:8px;
  display:none;
  box-shadow:0 4px 12px rgba(0,0,0,.15);
}
</style>
</head>

<body>

<div id="home"></div>
<div id="viewer"></div>
<button id="backBtn">Voltar</button>
<div id="loading">Carregando...</div>

<script type="module">

import * as THREE from 'three';

import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.136.0/examples/jsm/controls/OrbitControls.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.136.0/examples/jsm/loaders/GLTFLoader.js';
import { DRACOLoader } from 'https://cdn.jsdelivr.net/npm/three@0.136.0/examples/jsm/loaders/DRACOLoader.js';

/* ======================
CONFIG
====================== */
const BASE_PATH = "./";
const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);

/* ======================
MODELOS
====================== */
const modelos = [
{
  nome:"Calcita",
  arquivo:BASE_PATH + "calcita/CalcitaPancakeBase.gltf",
  thumb:BASE_PATH + "thumbs/Calcita.png"
},
{
  nome:"GipsitaSelenita 50mm",
  arquivo:BASE_PATH + "GipsitaSelenita50mm.glb",
  thumb:BASE_PATH + "thumbs/GipsitaSelenita.png"
},
{
  nome:"GipsitaSelenita 105mm",
  arquivo:BASE_PATH + "GipsitaSelenita105mm.glb",
  thumb:BASE_PATH + "thumbs/GipsitaSelenita.png"
},
{
  nome:"Calcita Maclada 50mm",
  arquivo:BASE_PATH + "CalcitaMaclada50mm.glb",
  thumb:BASE_PATH + "thumbs/CalcitaMaclada.png"
},
{
  nome:"Calcita Maclada 105mm",
  arquivo:BASE_PATH + "CalcitaMaclada105mm.glb",
  thumb:BASE_PATH + "thumbs/CalcitaMaclada.png"
},
{
  nome:"Barita 50mm",
  arquivo:BASE_PATH + "Barita50mm.glb",
  thumb:BASE_PATH + "thumbs/Barita.png"
}
];

/* ======================
DOM
====================== */
const home = document.getElementById("home");
const viewer = document.getElementById("viewer");
const backBtn = document.getElementById("backBtn");
const loading = document.getElementById("loading");

/* ======================
CARDS
====================== */
modelos.forEach((m,i)=>{
  const card = document.createElement("div");
  card.className = "card";

  card.innerHTML = `
    <img loading="lazy" src="${m.thumb}">
    <p>${m.nome}</p>
  `;

  card.onclick = ()=>abrirModelo(i);
  home.appendChild(card);
});

/* ======================
THREE GLOBAL
====================== */
let scene;
let camera;
let renderer;
let controls;
let currentModel = null;

/* ======================
LOADERS (reutilizados)
====================== */
const draco = new DRACOLoader();
draco.setDecoderPath(
'https://www.gstatic.com/draco/versioned/decoders/1.5.6/'
);

const loader = new GLTFLoader();
loader.setDRACOLoader(draco);

/* ======================
INIT VIEWER
====================== */
function initViewer(){

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x808080);

  camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth/window.innerHeight,
    0.1,
    1000
  );

  camera.position.set(0,1.5,3);

  renderer = new THREE.WebGLRenderer({
    antialias:false,
    powerPreference:"high-performance"
  });

  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.physicallyCorrectLights = false;
  renderer.toneMapping = THREE.NoToneMapping;

  renderer.setPixelRatio(
    isMobile ? 1 : Math.min(window.devicePixelRatio, 1.5)
  );

  const scale = isMobile ? 0.85 : 1;

  renderer.setSize(
    window.innerWidth * scale,
    window.innerHeight * scale
  );

  viewer.appendChild(renderer.domElement);

  /* Luz simples */
  const ambient = new THREE.AmbientLight(0xffffff, 1.2);
  scene.add(ambient);

  const dir = new THREE.DirectionalLight(0xffffff, 1.0);
  dir.position.set(3,5,4);
  scene.add(dir);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = false;
  controls.enablePan = false;

  controls.addEventListener("change", render);

  render();
}

/* ======================
RENDER SOB DEMANDA
====================== */
function render(){
  if(renderer && scene && camera){
    renderer.render(scene,camera);
  }
}

/* ======================
FRAME MODEL
====================== */
function frameObject(obj){

  const box = new THREE.Box3().setFromObject(obj);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());

  const maxDim = Math.max(size.x,size.y,size.z);
  const distance = maxDim * 2.2;

  camera.position.set(
    center.x,
    center.y,
    center.z + distance
  );

  controls.target.copy(center);
  controls.update();

  render();
}

/* ======================
LIMPAR MODELO
====================== */
function clearCurrentModel(){

  if(!currentModel) return;

  currentModel.traverse(node=>{

    if(node.isMesh){

      if(node.geometry){
        node.geometry.dispose();
      }

      if(Array.isArray(node.material)){

        node.material.forEach(mat=>disposeMaterial(mat));

      }else if(node.material){

        disposeMaterial(node.material);
      }
    }
  });

  scene.remove(currentModel);
  currentModel = null;
}

function disposeMaterial(mat){

  if(mat.map) mat.map.dispose();
  if(mat.normalMap) mat.normalMap.dispose();
  if(mat.roughnessMap) mat.roughnessMap.dispose();
  if(mat.metalnessMap) mat.metalnessMap.dispose();
  if(mat.aoMap) mat.aoMap.dispose();
  if(mat.emissiveMap) mat.emissiveMap.dispose();
  if(mat.envMap) mat.envMap.dispose();

  mat.dispose();
}

/* ======================
ABRIR MODELO
====================== */
function abrirModelo(index){

  home.style.display = "none";
  viewer.style.display = "block";
  backBtn.style.display = "block";
  loading.style.display = "block";
  loading.innerText = "Carregando...";

  if(!renderer){
    initViewer();
  }

  clearCurrentModel();

  loader.load(

    modelos[index].arquivo,

    (gltf)=>{

      currentModel = gltf.scene;
      scene.add(currentModel);

      frameObject(currentModel);

      loading.style.display = "none";
    },

    (xhr)=>{

      if(xhr.total){
        const pct = (xhr.loaded/xhr.total)*100;
        loading.innerText =
        "Carregando " + pct.toFixed(0) + "%";
      }
    },

    (err)=>{
      console.error(err);
      loading.innerText = "Erro ao carregar";
    }
  );
}

/* ======================
VOLTAR
====================== */
backBtn.onclick = ()=>{

  clearCurrentModel();

  viewer.style.display = "none";
  home.style.display = "flex";
  backBtn.style.display = "none";
};

/* ======================
RESIZE
====================== */
window.addEventListener("resize", ()=>{

  if(!camera || !renderer) return;

  camera.aspect =
  window.innerWidth/window.innerHeight;

  camera.updateProjectionMatrix();

  const scale = isMobile ? 0.85 : 1;

  renderer.setSize(
    window.innerWidth * scale,
    window.innerHeight * scale
  );

  render();
});

</script>
</body>
</html>
