    .card:hover { transform:scale(1.05); }
    .card img { width:100%; height:140px; object-fit:cover; }
    .card p { margin:10px; text-align:center; }
    #viewer { display:none; width:100vw; height:100vh; }
    #backBtn { position:fixed; top:20px; left:20px; z-index:10; padding:10px; background:white; border:none; border-radius:5px; cursor:pointer; }

  </style>
</head>
