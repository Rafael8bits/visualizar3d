<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visualizador 3D com Three.js</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    canvas {
      display: block;
    }
    #loading {
      position: fixed;
      top: 20px;
      left: 20px;
      color: #333;
      font-family: Arial, sans-serif;
    }
    #error {
      position: fixed;
      top: 20px;
      left: 20px;
      color: red;
      font-family: Arial, sans-serif;
      background: white;
      padding: 10px;
      border-radius: 5px;
      display: none;
    }
  </style>
</head>
<body>
  <div id="loading">Carregando modelo...</div>
  <div id="error"></div>

  <script type="module">
    import * as THREE from 'https://cdn.skypack.dev/three@0.136.0';
    import { OrbitControls } from 'https://cdn.skypack.dev/three@0.136.0/examples/jsm/controls/OrbitControls.js';
    import { GLTFLoader } from 'https://cdn.skypack.dev/three@0.136.0/examples/jsm/loaders/GLTFLoader.js';

    // Cena
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf0f0f0);

    // Câmera
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.5, 3);

    // Renderizador
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Controles
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // Iluminação
    const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1);
    light.position.set(0, 20, 0);
    scene.add(light);

    // Helpers de debug
    const gridHelper = new THREE.GridHelper(10, 10);
    scene.add(gridHelper);
    const axesHelper = new THREE.AxesHelper(5);
    scene.add(axesHelper);

    // Elementos de UI
    const loadingElement = document.getElementById('loading');
    const errorElement = document.getElementById('error');

    // Loader GLTF
    const loader = new GLTFLoader();
    
    // Cubo temporário
    const geometry = new THREE.BoxGeometry();
    const material = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
    const cube = new THREE.Mesh(geometry, material);
    scene.add(cube);

    loader.load(
      './drusa.glb',
      (gltf) => {
        scene.remove(cube);
        scene.add(gltf.scene);
        loadingElement.style.display = 'none';
      },
      (xhr) => {
        const progress = (xhr.loaded / xhr.total * 100).toFixed(2);
        loadingElement.textContent = `Carregando: ${progress}%`;
      },
      (error) => {
        console.error('Erro ao carregar o modelo:', error);
        errorElement.textContent = `Erro ao carregar modelo: ${error.message}`;
        errorElement.style.display = 'block';
        loadingElement.style.display = 'none';
      }
    );

    // Resize handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Animação
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
