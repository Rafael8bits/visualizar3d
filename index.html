<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visualizador 3D Corrigido</title>
  <style>
    /* Mantenha os estilos anteriores */
  </style>
</head>
<body>
  <div id="loading">Carregando modelo...</div>
  <div id="error"></div>

  <script type="module">
    import * as THREE from 'https://cdn.skypack.dev/three@0.136.0';
    import { OrbitControls } from 'https://cdn.skypack.dev/three@0.136.0/examples/jsm/controls/OrbitControls.js';
    import { GLTFLoader } from 'https://cdn.skypack.dev/three@0.136.0/examples/jsm/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'https://cdn.skypack.dev/three@0.136.0/examples/jsm/loaders/DRACOLoader.js';

    // 1. Configuração do Ambiente
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/innerHeight, 0.1, 1000);
    
    // 2. Renderizador com configurações PBR
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.physicallyCorrectLights = true;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.5;
    document.body.appendChild(renderer.domElement);

    // 3. Environment Map essencial
    const envLoader = new THREE.CubeTextureLoader().setPath('https://threejs.org/examples/textures/equirectangular/');
    const environmentMap = envLoader.load([
      'px.jpg', 'nx.jpg',
      'py.jpg', 'ny.jpg',
      'pz.jpg', 'nz.jpg'
    ]);
    environmentMap.encoding = THREE.sRGBEncoding;
    scene.environment = environmentMap;
    scene.background = environmentMap;

    // 4. Sistema de Iluminação Reforçado
    const light1 = new THREE.DirectionalLight(0xffffff, 3);
    light1.position.set(2, 5, 3);
    light1.castShadow = true;
    scene.add(light1);

    const light2 = new THREE.HemisphereLight(0xffffff, 0x444444, 2);
    light2.position.set(0, 3, 0);
    scene.add(light2);

    // 5. Carregamento do Modelo com Correção de Materiais
    const loader = new GLTFLoader();
    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
    loader.setDRACOLoader(dracoLoader);

    loader.load('./drusa.glb', (gltf) => {
      gltf.scene.traverse((child) => {
        if (child.isMesh) {
          // 6. Correção de Materiais
          child.material.envMap = environmentMap;
          child.material.envMapIntensity = 2;
          child.material.needsUpdate = true;
          
          // 7. Forçar tipo de material se necessário
          if (!child.material.isMeshStandardMaterial) {
            child.material = new THREE.MeshStandardMaterial().copy(child.material);
          }
        }
      });
      scene.add(gltf.scene);
    });

    // Restante do código mantido
  </script>
</body>
</html>
