<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visualizador 3D - Iluminação Otimizada</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    canvas {
      display: block;
    }
    #loading {
      position: fixed;
      top: 20px;
      left: 20px;
      color: #333;
      font-family: Arial, sans-serif;
      background: rgba(255, 255, 255, 0.9);
      padding: 10px;
      border-radius: 5px;
    }
    #error {
      position: fixed;
      top: 20px;
      left: 20px;
      color: red;
      font-family: Arial, sans-serif;
      background: white;
      padding: 10px;
      border-radius: 5px;
      display: none;
    }
  </style>
</head>
<body>
  <div id="loading">Carregando modelo...</div>
  <div id="error"></div>

  <script type="module">
    import * as THREE from 'https://cdn.skypack.dev/three@0.136.0';
    import { OrbitControls } from 'https://cdn.skypack.dev/three@0.136.0/examples/jsm/controls/OrbitControls.js';
    import { GLTFLoader } from 'https://cdn.skypack.dev/three@0.136.0/examples/jsm/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'https://cdn.skypack.dev/three@0.136.0/examples/jsm/loaders/DRACOLoader.js';
    import { GUI } from 'https://cdn.skypack.dev/dat.gui';

    // Configuração inicial
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.5, 3);

    // Configuração do Renderizador
    const renderer = new THREE.WebGLRenderer({ 
      antialias: true,
      powerPreference: "high-performance"
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.physicallyCorrectLights = true;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.8;  // Exposição alta para clarear
    renderer.shadowMap.enabled = false;   // Desativa sombras
    document.body.appendChild(renderer.domElement);

    // Fundo branco e ambiente neutro
    scene.background = new THREE.Color(0xffffff);
    scene.environment = new THREE.CubeTextureLoader().load([
      'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=',
      'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=',
      'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=',
      'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=',
      'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=',
      'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII='
    ]);

    // Sistema de Iluminação Intenso
    const ambientLight = new THREE.AmbientLight(0xffffff, 2.0);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 3.0);
    directionalLight.position.set(3, 5, 2);
    scene.add(directionalLight);

    const fillLight = new THREE.DirectionalLight(0xffffff, 1.5);
    fillLight.position.set(-3, 2, -2);
    scene.add(fillLight);

    // Controles da Câmera
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // Carregamento do Modelo
    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
    
    const loader = new GLTFLoader();
    loader.setDRACOLoader(dracoLoader);
    
    const loadingElement = document.getElementById('loading');
    const errorElement = document.getElementById('error');

    loader.load(
      './drusa.glb',
      (gltf) => {
        gltf.scene.traverse((child) => {
          if (child.isMesh) {
            // Ajuste de Materiais para Melhor Visibilidade
            child.material.envMapIntensity = 0.3;
            child.material.metalness = 0.1;
            child.material.roughness = 0.7;
            child.material.needsUpdate = true;
            
            if (!child.material.isMeshStandardMaterial) {
              child.material = new THREE.MeshStandardMaterial({
                color: child.material.color,
                map: child.material.map,
                metalness: 0.1,
                roughness: 0.7
              });
            }
          }
        });
        
        scene.add(gltf.scene);
        loadingElement.style.display = 'none';
      },
      (xhr) => {
        const progress = (xhr.loaded / xhr.total * 100).toFixed(2);
        loadingElement.textContent = `Carregando: ${progress}%`;
      },
      (error) => {
        console.error('Erro:', error);
        errorElement.textContent = `Erro: ${error.message}`;
        errorElement.style.display = 'block';
        loadingElement.style.display = 'none';
      }
    );

    // Interface de Controle para Ajustes
    const gui = new GUI();
    const params = {
      exposure: 1.8,
      ambient: 2.0,
      directional: 3.0,
      fillLight: 1.5
    };

    gui.add(params, 'exposure', 0.5, 4).name('Exposição').onChange(v => {
      renderer.toneMappingExposure = v;
    });
    
    gui.add(params, 'ambient', 0, 4).name('Luz Ambiente').onChange(v => {
      ambientLight.intensity = v;
    });
    
    gui.add(params, 'directional', 0, 5).name('Luz Principal').onChange(v => {
      directionalLight.intensity = v;
    });
    
    gui.add(params, 'fillLight', 0, 3).name('Luz de Preenchimento').onChange(v => {
      fillLight.intensity = v;
    });

    // Responsividade
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Animação
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
