<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visualizador 3D Profissional</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    canvas {
      display: block;
    }
    #loading {
      position: fixed;
      top: 20px;
      left: 20px;
      color: #333;
      font-family: Arial, sans-serif;
      background: rgba(255, 255, 255, 0.9);
      padding: 10px;
      border-radius: 5px;
    }
    #error {
      position: fixed;
      top: 20px;
      left: 20px;
      color: red;
      font-family: Arial, sans-serif;
      background: white;
      padding: 10px;
      border-radius: 5px;
      display: none;
    }
  </style>
</head>
<body>
  <div id="loading">Carregando modelo...</div>
  <div id="error"></div>

  <script type="module">
    import * as THREE from 'https://cdn.skypack.dev/three@0.136.0';
    import { OrbitControls } from 'https://cdn.skypack.dev/three@0.136.0/examples/jsm/controls/OrbitControls.js';
    import { GLTFLoader } from 'https://cdn.skypack.dev/three@0.136.0/examples/jsm/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'https://cdn.skypack.dev/three@0.136.0/examples/jsm/loaders/DRACOLoader.js';
    import { GUI } from 'https://cdn.skypack.dev/dat.gui';

    // 1. Configuração Inicial
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.5, 3);

    // 2. Configuração do Renderizador
    const renderer = new THREE.WebGLRenderer({ 
      antialias: true,
      powerPreference: "high-performance"
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.physicallyCorrectLights = true;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // 3. Environment Map
    const envLoader = new THREE.CubeTextureLoader()
      .setPath('https://threejs.org/examples/textures/equirectangular/');
    
    const environmentMap = envLoader.load([
      'px.jpg', 'nx.jpg',
      'py.jpg', 'ny.jpg',
      'pz.jpg', 'nz.jpg'
    ]);
    
    scene.environment = environmentMap;
    scene.background = new THREE.Color(0xffffff); // Fundo branco

    // 4. Sistema de Iluminação
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 2.5);
    directionalLight.position.set(5, 5, 5);
    directionalLight.castShadow = true;
    directionalLight.shadow.mapSize.width = 2048;
    directionalLight.shadow.mapSize.height = 2048;
    scene.add(directionalLight);

    const hemisphereLight = new THREE.HemisphereLight(0x4477ff, 0xaa7744, 0.5);
    hemisphereLight.position.set(0, 2, 0);
    scene.add(hemisphereLight);

    // 5. Controles e Helpers
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // 6. Configuração do Draco Loader
    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
    
    // 7. Carregamento do Modelo
    const loader = new GLTFLoader();
    loader.setDRACOLoader(dracoLoader);
    
    const loadingElement = document.getElementById('loading');
    const errorElement = document.getElementById('error');

    loader.load(
      './drusa.glb',
      (gltf) => {
        gltf.scene.traverse((child) => {
          if (child.isMesh) {
            // 8. Correção de Materiais
            child.material.envMap = environmentMap;
            child.material.envMapIntensity = 1.5;
            child.material.needsUpdate = true;
            
            // Forçar PBR materials
            if (!child.material.isMeshStandardMaterial) {
              child.material = new THREE.MeshStandardMaterial().copy(child.material);
            }
            
            child.castShadow = true;
            child.receiveShadow = true;
          }
        });
        
        scene.add(gltf.scene);
        loadingElement.style.display = 'none';
      },
      (xhr) => {
        const progress = (xhr.loaded / xhr.total * 100).toFixed(2);
        loadingElement.textContent = `Carregando: ${progress}%`;
      },
      (error) => {
        console.error('Erro:', error);
        errorElement.textContent = `Erro: ${error.message}`;
        errorElement.style.display = 'block';
        loadingElement.style.display = 'none';
      }
    );

    // 9. Interface de Controle (GUI)
    const gui = new GUI();
    const params = {
      exposure: 1.2,
      ambient: 0.8,
      directional: 2.5,
      envIntensity: 1.5
    };

    gui.add(params, 'exposure', 0.1, 3).name('Exposição').onChange(v => {
      renderer.toneMappingExposure = v;
    });
    
    gui.add(params, 'ambient', 0, 2).name('Luz Ambiente').onChange(v => {
      ambientLight.intensity = v;
    });
    
    gui.add(params, 'directional', 0, 5).name('Luz Principal').onChange(v => {
      directionalLight.intensity = v;
    });
    
    gui.add(params, 'envIntensity', 0, 3).name('Intensidade Env').onChange(v => {
      scene.traverse(child => {
        if (child.isMesh && child.material) {
          child.material.envMapIntensity = v;
        }
      });
    });

    // 10. Responsividade
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 11. Animação
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
