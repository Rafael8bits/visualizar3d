<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Galeria 3D</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.136.0/build/three.module.js",
      "three/": "https://cdn.jsdelivr.net/npm/three@0.136.0/"
    }
  }
  </script>

  <style>
    body { margin:0; font-family:Arial; background:#f5f5f5; }
    #home { display:flex; flex-wrap:wrap; gap:20px; padding:20px; justify-content:center; }
    .card { width:220px; background:white; border-radius:10px; box-shadow:0 4px 10px rgba(0,0,0,0.1); cursor:pointer; overflow:hidden; transition:0.2s; }
    .card:hover { transform:scale(1.05); }
    .card img { width:100%; height:140px; object-fit:cover; }
    .card p { margin:10px; text-align:center; }
    #viewer { display:none; width:100vw; height:100vh; }
    #backBtn { position:fixed; top:20px; left:20px; z-index:10; padding:10px; background:white; border:none; border-radius:5px; cursor:pointer; }
    #loading { position:fixed; top:20px; right:20px; background:white; padding:10px; border-radius:5px; display:none; font-weight: bold; }
  </style>
</head>

<body>

<div id="home"></div>
<div id="viewer"></div>
<button id="backBtn" style="display:none;">Voltar</button>
<div id="loading">Carregando...</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/examples/jsm/loaders/DRACOLoader.js';

THREE.Cache.enabled = true;

const BASE_PATH = "./";
const modelos = [
  { nome: "Calcita", arquivo: BASE_PATH + "calcita/CalcitaPancakeBase.gltf", thumb: BASE_PATH + "thumbs/Calcita.png" },
  { nome: "GipsitaSelenita 50mm", arquivo: BASE_PATH + "GipsitaSelenita50mm.glb", thumb: BASE_PATH + "thumbs/GipsitaSelenita.png" },
  { nome: "GipsitaSelenita 105mm", arquivo: BASE_PATH + "GipsitaSelenita105mm.glb", thumb: BASE_PATH + "thumbs/GipsitaSelenita.png" },
  { nome: "Calcita Maclada 50mm", arquivo: BASE_PATH + "CalcitaMaclada50mm.glb", thumb: BASE_PATH + "thumbs/CalcitaMaclada.png" },
  { nome: "Calcita Maclada 105mm", arquivo: BASE_PATH + "CalcitaMaclada105mm.glb", thumb: BASE_PATH + "thumbs/CalcitaMaclada.png" },
  { nome: "Afloramento de Barita 50mm", arquivo: BASE_PATH + "Barita50mm.glb", thumb: BASE_PATH + "thumbs/Barita.png" }
];

const home = document.getElementById('home');
const viewer = document.getElementById('viewer');
const backBtn = document.getElementById('backBtn');
const loading = document.getElementById('loading');

let scene, camera, renderer, controls;
let currentModels = [];

const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');

modelos.forEach((m,i)=>{
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<img src="${m.thumb}"><p>${m.nome}</p>`;
  card.onclick = () => abrirModelo(i);
  home.appendChild(card);
});

function initViewer() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x808080);
  
  // Afastamos a posição da câmera no eixo Z de 3 para 5, diminuindo o zoom inicial
  camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.set(0, 1.5, 5);
  
  renderer = new THREE.WebGLRenderer({ antialias:false, powerPreference: 'high-performance' });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
  viewer.appendChild(renderer.domElement);
  
  // Mantemos apenas a luz ambiente para preservar as cores reais do modelo
  scene.add(new THREE.AmbientLight(0xffffff, 1.0));

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.target.set(0, 1.0, 0); // Define o ponto focal padrão do controle
  controls.update();
  
  animate();
}

function abrirModelo(index) {
  if (!renderer) initViewer();
  home.style.display = 'none';
  viewer.style.display = 'block';
  backBtn.style.display = 'block';
  loading.style.display = 'block';

  const loader = new GLTFLoader();
  loader.setDRACOLoader(dracoLoader);

  loader.load(
    modelos[index].arquivo,
    (gltf) => {
      const model = gltf.scene;
      scene.add(model);
      currentModels.push(model);
      loading.style.display = 'none';
    },
    (xhr) => {
      if (xhr.lengthComputable) {
        const percent = Math.round((xhr.loaded / xhr.total) * 100);
        loading.innerText = `Carregando ${percent}%`;
      }
    },
    (error) => {
      console.error(error);
      loading.innerText = 'Erro ao carregar';
    }
  );
}

backBtn.onclick = () => {
  currentModels.forEach(m => {
    m.traverse(n => { 
      if (n.isMesh) { 
        n.geometry.dispose(); 
        const materiais = Array.isArray(n.material) ? n.material : [n.material];
        materiais.forEach(mat => {
          for (const key in mat) {
            if (mat[key] && mat[key].isTexture) mat[key].dispose();
          }
          mat.dispose();
        });
      } 
    });
    scene.remove(m);
  });
  
  if (renderer) renderer.renderLists.dispose();
  currentModels = [];
  viewer.style.display = 'none';
  home.style.display = 'flex';
  backBtn.style.display = 'none';
};

function animate() {
  requestAnimationFrame(animate);
  if (renderer) { 
    controls.update(); 
    renderer.render(scene, camera); 
  }
}

window.addEventListener('resize',()=>{
  if(!camera) return;
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
