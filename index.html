<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Galeria 3D </title>

  <!-- Import Map (Three.js r136) -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.136.0/build/three.module.js",
        "three/": "https://cdn.jsdelivr.net/npm/three@0.136.0/"
      }
    }
  </script>

  <style>
    /* Reset e ajustes mobile first */
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      overscroll-behavior: none; /* Evita puxar recarga no iOS */
    }

    /* Galeria de cards */
    #home {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      padding: 16px;
      justify-content: center;
      align-items: center;
    }

    .card {
      width: calc(50% - 16px);
      max-width: 180px;
      min-width: 140px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      cursor: pointer;
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      will-change: transform;
    }

    .card:active {
      transform: scale(0.97);
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }

    .card img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    .card p {
      margin: 10px 8px;
      text-align: center;
      font-size: 0.9rem;
      font-weight: 500;
      color: #333;
      word-break: break-word;
    }

    /* Visualizador 3D */
    #viewer {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 20;
      background: #1a1a1a;
    }

    /* Botão voltar otimizado para toque */
    #backBtn {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 30;
      padding: 12px 20px;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      color: white;
      border: none;
      border-radius: 40px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      touch-action: manipulation;
    }

    #backBtn:active {
      background: rgba(0,0,0,0.9);
    }

    /* Loading moderno e discreto */
    #loading {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(12px);
      color: white;
      padding: 10px 20px;
      border-radius: 40px;
      font-size: 0.9rem;
      font-weight: 500;
      display: none;
      z-index: 30;
      white-space: nowrap;
      font-family: monospace;
      pointer-events: none;
    }

    /* Responsivo: cards maiores em tablets */
    @media (min-width: 600px) {
      .card {
        width: 200px;
      }
    }
  </style>
</head>
<body>

<div id="home"></div>
<div id="viewer"></div>
<button id="backBtn" style="display:none;">← Voltar</button>
<div id="loading">⏳ Carregando...</div>

<script type="module">
  // =========================
  // CONFIGURAÇÕES OTIMIZADAS
  // =========================
  const BASE_PATH = "./";
  // Detecta dispositivo móvel via largura da tela ou User Agent
  const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 768;
  // Limita pixel ratio para economizar GPU (celulares ganham muito com isso)
  const MAX_PIXEL_RATIO = isMobile ? 1.0 : 1.5;

  // =========================
  // IMPORTS
  // =========================
  import * as THREE from 'three';
  import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
  import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
  import { DRACOLoader } from 'three/examples/jsm/loaders/DRACOLoader.js';

  // =========================
  // LISTA DE MODELOS (mantida original)
  // =========================
  const modelos = [
    { nome: "Calcita", arquivo: BASE_PATH + "CalcitaPancakeBase.glb", thumb: BASE_PATH + "thumbs/Calcita.png" },
    { nome: "GipsitaSelenita Lente 50mm", arquivo: BASE_PATH + "GipsitaSelenita50mm.glb", thumb: BASE_PATH + "thumbs/GipsitaSelenita.png" },
    { nome: "GipsitaSelenita Lente 105mm", arquivo: BASE_PATH + "GipsitaSelenita105mm.glb", thumb: BASE_PATH + "thumbs/GipsitaSelenita.png" },
    { nome: "Calcita Maclada Lente 50mm", arquivo: BASE_PATH + "CalcitaMaclada50mm.glb", thumb: BASE_PATH + "thumbs/CalcitaMaclada.png" },
    { nome: "Calcita Maclada Lente 105mm", arquivo: BASE_PATH + "CalcitaMaclada105mm.glb", thumb: BASE_PATH + "thumbs/CalcitaMaclada.png" },
    { nome: "Afloramento de Barita Lente 50mm", arquivo: BASE_PATH + "Barita50mm.glb", thumb: BASE_PATH + "thumbs/Barita.png" }
  ];

  // =========================
  // DOM ELEMENTOS
  // =========================
  const homeDiv = document.getElementById('home');
  const viewerDiv = document.getElementById('viewer');
  const backBtn = document.getElementById('backBtn');
  const loadingDiv = document.getElementById('loading');

  // =========================
  // CRIAÇÃO DOS CARDS (COM PRELOAD DE THUMB)
  // =========================
  modelos.forEach((model, idx) => {
    const card = document.createElement('div');
    card.className = 'card';
    // Imagem com lazy loading nativo
    card.innerHTML = `<img src="${model.thumb}" loading="lazy" alt="${model.nome}"><p>${model.nome}</p>`;
    card.addEventListener('click', (e) => {
      e.preventDefault();
      abrirModelo(idx);
    });
    homeDiv.appendChild(card);
  });

  // =========================
  // VARIÁVEIS GLOBAIS THREE
  // =========================
  let scene, camera, renderer, controls;
  let currentModel = null;       // Guarda o modelo ativo
  let animationId = null;        // Para controle da animação
  let isDisposing = false;       // Evita conflitos ao limpar

  // =========================
  // INICIALIZA O VISUALIZADOR (SÓ CHAMADO UMA VEZ)
  // =========================
  function initViewer() {
    if (renderer) return; // já inicializado

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x2a2a2a); // Fundo escuro suave para contraste

    // Câmera com FOV levemente reduzido para mobile (melhor performance de frustum)
    camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.2, 2.5);

    renderer = new THREE.WebGLRenderer({ antialias: !isMobile, powerPreference: "low-power" }); // Economia de bateria
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, MAX_PIXEL_RATIO));
    renderer.physicallyCorrectLights = true;
    // Desativa mapas de sombra para performance (nenhuma luz precisa de sombra ativa)
    renderer.shadowMap.enabled = false;
    // Configuração de cores otimizada (sem encoding antigo que consome RAM)
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.9;

    viewerDiv.appendChild(renderer.domElement);

    // Iluminação leve mas eficaz
    const ambientLight = new THREE.AmbientLight(0xffffff, 2);
    scene.add(ambientLight);
    
    // Luz direcional principal (sem sombras)
    const mainLight = new THREE.DirectionalLight(0xfff5e0, 1.2);
    mainLight.position.set(2, 3, 4);
    scene.add(mainLight);
    
    // Luz de preenchimento traseira suave
    const fillLight = new THREE.DirectionalLight(0x88aaff, 0.5);
    fillLight.position.set(-1, 1, -2);
    scene.add(fillLight);

    // Controles com toque suave (otimizado para mobile)
    controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;      // Inércia suave
    controls.dampingFactor = 0.05;
    controls.rotateSpeed = isMobile ? 1.0 : 1.2;
    controls.zoomSpeed = isMobile ? 0.8 : 1.0;
    controls.enableZoom = true;
    controls.enablePan = false;         // Desativa pan para simplificar em mobile
    controls.target.set(0, 0.5, 0);

    // Inicia o loop de animação apenas se não existir
    if (!animationId) {
      function animate() {
        animationId = requestAnimationFrame(animate);
        if (controls) controls.update();
        if (renderer && scene && camera) {
          renderer.render(scene, camera);
        }
      }
      animate();
    }
  }

  // =========================
  // AJUSTA CÂMARA PARA ENQUADRAR O MODELO (MAIS RÁPIDO)
  // =========================
  function frameObject(obj) {
    // Calcula bounding box do modelo
    const box = new THREE.Box3().setFromObject(obj);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    
    // Distância ideal baseada no tamanho do modelo
    const maxDim = Math.max(size.x, size.y, size.z);
    const distance = maxDim / Math.tan((camera.fov * Math.PI) / 360);
    
    camera.position.copy(center);
    camera.position.z += distance * 0.9; // leve ajuste para não cortar
    controls.target.copy(center);
    controls.update();
  }

  // =========================
  // LIMPA RECURSOS DO MODELO ATUAL (GEOMETRIA, TEXTURAS, MATERIAIS)
  // =========================
  function disposeCurrentModel() {
    if (!currentModel) return;
    
    // Evita double dispose
    if (isDisposing) return;
    isDisposing = true;
    
    currentModel.traverse((node) => {
      if (node.isMesh) {
        if (node.geometry) node.geometry.dispose();
        if (node.material) {
          if (Array.isArray(node.material)) {
            node.material.forEach(m => {
              if (m.map) m.map.dispose();
              m.dispose();
            });
          } else {
            if (node.material.map) node.material.map.dispose();
            node.material.dispose();
          }
        }
      }
    });
    
    scene.remove(currentModel);
    currentModel = null;
    isDisposing = false;
  }

  // =========================
  // CARREGAR MODELO COM DRACO + FEEDBACK VISUAL
  // =========================
  let activeLoader = null; // para cancelar carregamento (opcional)
  
  function abrirModelo(index) {
    // Esconde home e mostra viewer
    homeDiv.style.display = 'none';
    viewerDiv.style.display = 'block';
    backBtn.style.display = 'block';
    
    // Inicializa o renderizador se necessário
    initViewer();
    
    // Remove modelo anterior (libera memória rapidamente)
    disposeCurrentModel();
    
    // Mostra loading com texto dinâmico
    loadingDiv.style.display = 'block';
    loadingDiv.textContent = `📦 Carregando ${modelos[index].nome}... 0%`;
    
    // Configura DRACOLoader (caminho confiável e cacheável)
    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
    dracoLoader.preload(); // pré-carrega o decodificador para ganho de tempo
    
    const gltfLoader = new GLTFLoader();
    gltfLoader.setDRACOLoader(dracoLoader);
    
    // Carrega o modelo
    gltfLoader.load(
      modelos[index].arquivo,
      (gltf) => {
        const model = gltf.scene;
        // Ajusta escala caso necessário (modelos podem vir em tamanhos diferentes)
        model.scale.set(1, 1, 1);
        model.position.set(0, 0, 0);
        
        scene.add(model);
        currentModel = model;
        
        // Enquadra o modelo na câmera de forma suave
        frameObject(model);
        
        // Esconde loading
        loadingDiv.style.display = 'none';
        dracoLoader.dispose(); // libera recurso do draco após carregamento
      },
      (xhr) => {
        if (xhr.total) {
          const percent = Math.floor((xhr.loaded / xhr.total) * 100);
          loadingDiv.textContent = `⏳ Carregando ${modelos[index].nome}... ${percent}%`;
        }
      },
      (error) => {
        console.error('Erro ao carregar modelo:', error);
        loadingDiv.textContent = `❌ Falha ao carregar ${modelos[index].nome}`;
        setTimeout(() => {
          loadingDiv.style.display = 'none';
        }, 2000);
        // Opcional: tratar fallback
      }
    );
  }

  // =========================
  // VOLTAR PARA GALERIA (LIBERAÇÃO COMPLETA DE MEMÓRIA)
  // =========================
  backBtn.onclick = () => {
    // Cancela animação de loading visual e libera modelo
    if (activeLoader) activeLoader = null;
    disposeCurrentModel();
    
    // Esconde visualizador e exibe home
    viewerDiv.style.display = 'none';
    homeDiv.style.display = 'flex';
    backBtn.style.display = 'none';
    loadingDiv.style.display = 'none';
    
    // Opcional: força coleta de lixo (só ajuda se browser quiser)
    // Não chamamos gc() porque não é padrão, mas a memória já foi liberada.
  };

  // =========================
  // AJUSTE DE TAMANHO DE TELA (COM THROTTLE PARA EVITAR REPAINT EXCESSIVO)
  // =========================
  let resizeTimeout;
  window.addEventListener('resize', () => {
    if (resizeTimeout) clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(() => {
      if (camera && renderer) {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, MAX_PIXEL_RATIO));
      }
    }, 100);
  });
  
  // Pré-carregar texturas? Não necessário, mas podemos configurar uma mensagem inicial amigável.
  console.log('Galeria 3D otimizada para mobile - pronto');
</script>
</body>
</html>
